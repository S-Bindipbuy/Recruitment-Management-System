{{define "page-organizations"}}
<div class="space-y-6" id="organizations-page">
    <div class="page-header">
        <div class="page-header-left">
            <h3 class="page-title">Organizations</h3>
            <p class="page-subtitle">Manage company organizations</p>
        </div>
        <div class="page-actions">
            <button onclick="document.getElementById('new-organization-dialog').showModal()" class="btn btn-primary"><i class="fa-solid fa-plus text-xs"></i> New Organization</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead class="table-head">
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th style="width: 120px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {{if .Organizations}}
                {{range .Organizations}}
                <tr>
                    <td class="table-cell-bold">{{.Name}}</td>
                    <td class="table-cell-muted">{{.Description}}</td>
                    <td><span class="badge {{if eq .Status "active"}}badge-active{{else}}badge-inactive{{end}}">{{.Status}}</span></td>
                    <td>
                        <div style="display: flex; gap: 0.5rem;">
                            <button data-id="{{.ID}}" data-name="{{.Name}}" data-description="{{.Description}}" data-status="{{.Status}}" onclick="openEditOrganization(this)" class="btn btn-ghost" style="padding: 0.375rem 0.625rem; font-size: 0.875rem;"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteOrganization({{.ID}})" class="btn btn-ghost" style="padding: 0.375rem 0.625rem; font-size: 0.875rem; color: #e06c75;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
                {{end}}
                {{else}}
                <tr><td colspan="4" class="text-center text-muted">No organizations defined.</td></tr>
                {{end}}
            </tbody>
        </table>
    </div>

    <dialog id="new-organization-dialog" class="dialog">
        <form class="dialog-body" method="post" action="/pages/organizations" data-ajax data-close-dialog>
            <h3 class="dialog-title">New Organization</h3>
            <div class="form-group">
                <label class="form-label-sm">Name</label>
                <input type="text" name="name" required class="form-input form-input-lg">
            </div>
            <div class="form-group">
                <label class="form-label-sm">Description</label>
                <textarea name="description" class="form-textarea"></textarea>
            </div>
            <div class="dialog-footer">
                <button type="button" onclick="this.closest('dialog').close()" class="btn btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-love">Create Organization</button>
            </div>
        </form>
    </dialog>

    <dialog id="edit-organization-dialog" class="dialog">
        <form id="edit-organization-form" class="dialog-body" method="post" data-ajax data-method="PUT" data-close-dialog>
            <h3 class="dialog-title">Edit Organization</h3>
            <div class="form-group">
                <label class="form-label-sm">Name</label>
                <input type="text" name="name" id="edit-org-name" required class="form-input form-input-lg">
            </div>
            <div class="form-group">
                <label class="form-label-sm">Description</label>
                <textarea name="description" id="edit-org-description" class="form-textarea"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label-sm">Status</label>
                <select name="status" id="edit-org-status" class="form-select form-input-lg">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <div class="dialog-footer">
                <button type="button" onclick="this.closest('dialog').close()" class="btn btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-love">Save Changes</button>
            </div>
        </form>
    </dialog>
</div>

<script>
function openEditOrganization(el) {
    var ds = el.dataset;
    document.getElementById('edit-org-name').value = ds.name || '';
    document.getElementById('edit-org-description').value = ds.description || '';
    document.getElementById('edit-org-status').value = ds.status || 'active';
    document.getElementById('edit-organization-form').dataset.url = '/pages/organizations/' + ds.id;
    document.getElementById('edit-organization-dialog').showModal();
}
function deleteOrganization(id) {
    if (!confirm('Are you sure you want to delete this organization?')) return;
    emsRequest('DELETE', '/pages/organizations/' + id, '#page');
}
</script>
{{end}}
